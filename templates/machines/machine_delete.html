{% extends 'base.html' %}

{% block title %}Delete machine{% endblock %}

{% block content %}
    <div class="card border-danger">
        <div class="card-body">
            <h1 class="h4">Delete machine</h1>
            <p>Are you sure you want to delete <strong>{{ object.model }}</strong>? This cannot be undone.</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, delete</button>
                <a href="{% url 'machines:detail' pk=object.pk %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
