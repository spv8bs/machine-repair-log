{% extends 'base.html' %}

{% block title %}Delete part{% endblock %}

{% block content %}
    <div class="card border-danger">
        <div class="card-body">
            <h1 class="h4">Delete part</h1>
            <p>
                Are you sure you want to delete <strong>{{ object.name }}</strong>?
                It will be removed from all repairs that used it.
                This cannot be undone.
            </p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_div }}
                <button type="submit" class="btn btn-danger">Yes, delete</button>
                <a href="{% url 'resources:part_details' pk=object.pk %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
