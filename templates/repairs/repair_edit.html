{% extends 'base.html' %}

{% block title %}Edit repair{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="h4 mb-3">Edit repair of {{ object.machine.model }}</h1>

                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        {{ form.as_div }}
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'repairs:detail' pk=object.pk %}" class="btn btn-link">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
