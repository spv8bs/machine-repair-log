{% extends 'base.html' %}

{% block title %}
    Select machine
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="h4 mb-3">Which machine is the repair for?</h1>

                    <form method="get" action="{% url 'repairs:create' %}">
                        <select name="machine" required>
                            <option value="">Select a machine</option>
                            {% for machine in machines %}
                                <option value="{{ machine.pk }}">{{ machine.model }}</option>
                            {% endfor %}
                        </select>
                        <button type="submit" class="btn btn-primary">Next</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
